# AUTO-GENERATED — theme: rose-pine

format = """
╭─ $directory$git_branch$git_status
╰─ $character"""

add_newline = false

[directory]
style = "bold #9ccfd8"
format = "[$path]($style) "
truncation_length = 3
truncate_to_repo = true

[git_branch]
symbol = "󰘬 "
style = "bold #c4a7e7"
format = "[$symbol$branch]($style) "

[git_status]
style = "bold #c4a7e7"
format = "[$all_status$ahead_behind]($style)"

[character]
success_symbol = "[❯](#9ccfd8)"
error_symbol = "[❯](#eb6f92)"
vimcmd_symbol = "[❮](#c4a7e7)"

[cmd_duration]
min_time = 1000
format = "took [$duration](#9ccfd8) "

[username]
show_always = false
style_user = "bold #9ccfd8"

[hostname]
ssh_only = true
style = "bold #c4a7e7"

[line_break]
disabled = false
